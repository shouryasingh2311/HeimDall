<!doctype html>
<html lang="en" data-collector>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heimdal local scenarios</title>
  <meta name="color-scheme" content="light dark">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/collector.css">
  <script src="/scenarios.js" defer></script>
</head>
<body>
  <header>
    <span class="wordmark">Heimdal</span>
    <div class="collector-tools">
      <span>Local collector</span>
      <label class="theme-switch"><input type="checkbox" role="switch" data-theme-switch>Dark mode</label>
    </div>
  </header>
  <main>
    <h1>Scenario runner</h1>
    <p class="intro">Run a verification scenario on this collector. Review its evidence here and in the central workspace.</p>
    <label class="token-field">Local session token<input id="token" type="password" autocomplete="off"></label>
    <div class="runner">
      <section><h2>Available scenarios</h2>
        <ol>
          <li><button data-run="1">Verify local secret handling</button></li>
          <li><button data-run="2">Pause metadata delivery for 30 seconds</button></li>
          <li><button data-run="3">Count failed logins</button></li>
          <li><button data-run="4">Inject related network degradation</button></li>
          <li><button data-run="5">Detect a sustained CPU deviation</button></li>
          <li><button data-run="6">Group related alerts with an unrelated control</button></li>
          <li><button data-run="7">Replay duplicate and late events</button></li>
          <li><button data-run="8">Simulate memory remediation</button><small>Approve and roll back from the operator dashboard.</small></li>
        </ol>
        <button class="secondary" id="reset">Reset demo inputs</button>
      </section>
      <section><h2>Run result</h2><p id="status" role="status"></p><pre id="result"></pre></section>
    </div>
  </main>
</body>
</html>
