[project]
name = "heimdal-observability"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.21,<1",
    "cryptography>=44,<51",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "psutil>=7,<8",
    "tzdata>=2025.1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<10", "pytest-asyncio>=1,<2"]
browser = ["playwright>=1.52,<2"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.collector" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
